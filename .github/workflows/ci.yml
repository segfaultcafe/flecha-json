name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Flecha 0.4 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      FLECHA_COMMIT: "52a57e3a4529e7c9e6e15ae2455b1484b058dbae"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out Flecha 0.4 toolchain
        uses: actions/checkout@v4
        with:
          repository: segfaultcafe/flecha
          ref: ${{ env.FLECHA_COMMIT }}
          path: toolchain-src

      - name: Build Flecha 0.4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/flecha"
          cmake -S toolchain-src -B toolchain-build -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build toolchain-build \
            --target flecha longbow flecha-lsp \
            --parallel 2
          cmake --install toolchain-build --prefix "$install_root"
          printf '%s/bin\n' "$install_root" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected="0.4.0-dev-g${FLECHA_COMMIT:0:12}"
          test "$(flecha --version)" = "flecha $expected"
          test "$(longbow --version)" = "longbow $expected"

      - name: Check and test
        run: |
          longbow check
          longbow test --verbose

      - name: Build and run the README example
        run: tools/check-readme-example.sh

      - name: Verify deterministic package archive
        shell: bash
        run: |
          set -euo pipefail
          longbow publish --dry-run > "$RUNNER_TEMP/dry-run-1.txt"
          longbow publish --dry-run > "$RUNNER_TEMP/dry-run-2.txt"
          diff --unified "$RUNNER_TEMP/dry-run-1.txt" "$RUNNER_TEMP/dry-run-2.txt"
          grep --fixed-strings 'flecha/json@0.2.0' "$RUNNER_TEMP/dry-run-1.txt"
