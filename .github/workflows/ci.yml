name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Flecha 0.3 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      FLECHA_VERSION: "0.3.0"
      FLECHA_ARCHIVE_SHA256: "6c8382207e2a6290d25394d893c4947d6b0a564a4c4a1b2b34163c8eea0d1e88"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flecha 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flecha.tar.gz"
          install_root="$RUNNER_TEMP/flecha"
          curl --fail --location --retry 3 \
            "https://github.com/segfaultcafe/flecha/releases/download/v${FLECHA_VERSION}/flecha-${FLECHA_VERSION}-Linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FLECHA_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_root"
          tar --extract --gzip --file "$archive" --directory "$install_root" --strip-components=1
          printf '%s/bin\n' "$install_root" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          test "$(flecha --version)" = "flecha 0.3.0"
          test "$(longbow --version)" = "longbow 0.3.0"

      - name: Check and test
        run: |
          longbow check
          longbow test --verbose

      - name: Build and run the README example
        run: tools/check-readme-example.sh

      - name: Verify deterministic package archive
        shell: bash
        run: |
          set -euo pipefail
          longbow publish --dry-run > "$RUNNER_TEMP/dry-run-1.txt"
          longbow publish --dry-run > "$RUNNER_TEMP/dry-run-2.txt"
          diff --unified "$RUNNER_TEMP/dry-run-1.txt" "$RUNNER_TEMP/dry-run-2.txt"
          grep --fixed-strings 'flecha/json@0.1.1' "$RUNNER_TEMP/dry-run-1.txt"
